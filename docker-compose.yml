

services:
  db:
    image: postgres:15-alpine
    container_name: subspace_db
    restart: always
    environment:
      POSTGRES_USER: subspace_user
      POSTGRES_PASSWORD: SecretPostgresPassword123!
      POSTGRES_DB: subspace_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subspace_user -d subspace_database"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: subspace_web
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy # Ждем, пока Postgres полностью поднимется и пройдет тест
    env_file:
      - .env

volumes:
  postgres_data:
